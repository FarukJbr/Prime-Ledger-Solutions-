<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prime Ledger Solutions | אימייל אושר</title>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700;800&family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#0A1628;--gold:#C9A84C;--gold-light:#E8C870;--green:#10B981;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Assistant',sans-serif;background:radial-gradient(ellipse 80% 60% at 20% 50%,rgba(201,168,76,.08) 0%,transparent 60%),var(--navy);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.card{background:#fff;border-radius:20px;padding:44px 40px;width:100%;max-width:440px;box-shadow:0 25px 60px rgba(0,0,0,.35);text-align:center;}
.brand{font-family:'Heebo';font-size:17px;font-weight:900;color:var(--navy);margin-bottom:24px;}
.brand span{color:var(--gold);}
.icon{width:72px;height:72px;background:linear-gradient(135deg,#10B981,#34D399);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-bottom:20px;font-size:36px;line-height:1;}
h1{font-family:'Heebo';font-size:22px;color:var(--navy);margin-bottom:10px;}
p{font-size:14px;color:#6B7280;margin-bottom:24px;line-height:1.6;}
.btn{display:inline-block;padding:12px 32px;background:linear-gradient(135deg,var(--gold),var(--gold-light));color:var(--navy);text-decoration:none;border-radius:10px;font-size:14px;font-weight:800;font-family:'Assistant';cursor:pointer;border:none;transition:all .2s;}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(201,168,76,.4);}
.count{font-size:12px;color:#9CA3AF;margin-top:14px;}
</style>
</head>
<body>
<div class="card">
  <div class="brand">Prime <span>Ledger</span> Solutions</div>
  <div class="icon">✓</div>
  <h1>האימייל אושר בהצלחה!</h1>
  <p>החשבון שלך אומת. עכשיו תוכל להתחבר לפורטל הלקוחות.</p>
  <button class="btn" onclick="goLogin()">כניסה לפורטל ←</button>
  <div class="count">מועבר אוטומטית בעוד <span id="sec">5</span> שניות...</div>
</div>

<script>
const LOGIN_URL = "/portal.html";
let t = 5;
const iv = setInterval(() => {
  t--;
  document.getElementById('sec').textContent = t;
  if (t <= 0) { clearInterval(iv); goLogin(); }
}, 1000);
function goLogin() { window.location.href = LOGIN_URL; }
</script>
</body>
</html>
