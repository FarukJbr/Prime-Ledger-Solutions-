<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prime Ledger Solutions | איפוס סיסמה</title>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700;800&family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#0A1628;--gold:#C9A84C;--gold-light:#E8C870;--green:#10B981;--red:#EF4444;--gray-200:#E9ECEF;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Assistant',sans-serif;background:radial-gradient(ellipse 80% 60% at 20% 50%,rgba(201,168,76,.08) 0%,transparent 60%),var(--navy);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.card{background:#fff;border-radius:20px;padding:44px 40px;width:100%;max-width:440px;box-shadow:0 25px 60px rgba(0,0,0,.35);}
.logo{text-align:center;margin-bottom:28px;}
.logo-icon{width:56px;height:56px;background:linear-gradient(135deg,var(--gold),var(--gold-light));border-radius:14px;display:inline-flex;align-items:center;justify-content:center;font-family:'Heebo';font-size:18px;font-weight:900;color:var(--navy);margin-bottom:10px;}
.brand{font-family:'Heebo';font-size:17px;font-weight:900;color:var(--navy);display:block;}
.brand span{color:var(--gold);}
.logo-sub{font-size:11px;color:#9CA3AF;display:block;margin-top:3px;}
h1{font-family:'Heebo';font-size:20px;color:var(--navy);margin-bottom:6px;text-align:center;}
.sub{font-size:13px;color:#6B7280;text-align:center;margin-bottom:22px;line-height:1.5;}
.fg{margin-bottom:13px;}
.fl{display:block;font-size:12px;font-weight:600;color:var(--navy);margin-bottom:5px;}
.fi{width:100%;padding:10px 13px;border:1.5px solid var(--gray-200);border-radius:10px;font-size:13px;font-family:'Assistant';outline:none;transition:border-color .2s;}
.fi:focus{border-color:var(--gold);}
.btn{width:100%;padding:12px;background:linear-gradient(135deg,var(--gold),var(--gold-light));color:var(--navy);border:none;border-radius:10px;font-size:14px;font-weight:800;cursor:pointer;font-family:'Assistant';transition:all .2s;}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(201,168,76,.4);}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none;}
.err{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);border-radius:8px;padding:9px 13px;font-size:12px;color:var(--red);margin-bottom:12px;display:none;}
.ok{background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.25);border-radius:8px;padding:9px 13px;font-size:12px;color:var(--green);margin-bottom:12px;display:none;}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">PL</div>
    <span class="brand">Prime <span>Ledger</span> Solutions</span>
    <span class="logo-sub">פורטל לקוחות</span>
  </div>
  <h1>איפוס סיסמה</h1>
  <p class="sub">הכנס סיסמה חדשה לחשבונך</p>
  <div class="err" id="err"></div>
  <div class="ok"  id="ok"></div>
  <div class="fg">
    <label class="fl">סיסמה חדשה</label>
    <input id="pw1" type="password" class="fi" placeholder="לפחות 6 תווים" />
  </div>
  <div class="fg">
    <label class="fl">אישור סיסמה</label>
    <input id="pw2" type="password" class="fi" placeholder="חזור על הסיסמה" />
  </div>
  <button class="btn" id="btn" onclick="doReset()">עדכן סיסמה ←</button>
</div>

<script>
const LOGIN_URL = "/portal.html";
const SB_URL = 'https://urpzikwromhwtuffkhyr.supabase.co';
const SB_KEY = 'sb_publishable_DuDeBDU5Ee5d1xMkzi0Drg_kzFYYY44';
const { createClient } = supabase;
const sb = createClient(SB_URL, SB_KEY);

async function doReset() {
  const p1 = document.getElementById('pw1').value;
  const p2 = document.getElementById('pw2').value;
  const err = document.getElementById('err');
  const ok  = document.getElementById('ok');
  err.style.display = 'none';
  ok.style.display  = 'none';
  if (!p1 || !p2)  { err.textContent = 'נא למלא את שני השדות';            err.style.display = 'block'; return; }
  if (p1 !== p2)   { err.textContent = 'הסיסמאות אינן תואמות';            err.style.display = 'block'; return; }
  if (p1.length<6) { err.textContent = 'סיסמה חייבת להכיל לפחות 6 תווים'; err.style.display = 'block'; return; }
  const btn = document.getElementById('btn');
  btn.disabled = true; btn.textContent = 'מעדכן...';
  const { error } = await sb.auth.updateUser({ password: p1 });
  btn.disabled = false; btn.textContent = 'עדכן סיסמה ←';
  if (error) { err.textContent = error.message; err.style.display = 'block'; return; }
  ok.textContent = '✓ הסיסמה עודכנה! מועבר לדף ההתחברות...';
  ok.style.display = 'block';
  setTimeout(() => window.location.href = LOGIN_URL, 2500);
}
</script>
</body>
</html>
